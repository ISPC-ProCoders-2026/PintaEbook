<header class="topbar">
  <button 
    type="button" 
    class="menu-toggle" 
    (click)="onToggleSidebar()" 
    [attr.aria-expanded]="isSidebarOpen" 
    aria-controls="dashboard-sidebar" 
    aria-label="Abrir menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>
  
  <div class="topbar__breadcrumb">
    <span>Mi espacio</span>
    <b>{{ sectionName }}</b>
  </div>
  
  <div class="topbar__actions">
    @if (isAdmin) {
      <button type="button" class="icon-button" (click)="onAdminMetrics()" aria-label="Ver métricas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 19V5M4 19h16M8 16v-4M12 16V8M16 16v-7"/>
        </svg>
      </button>
    }
    <button type="button" class="icon-button" aria-label="Buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="10.8" cy="10.8" r="6.4"/>
        <path d="m16 16 4.2 4.2"/>
      </svg>
    </button>
    <button type="button" class="icon-button icon-button--notification" aria-label="Notificaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
      </svg>
    </button>
  </div>
</header>
