<section class="login-layout min-h-screen text-[#2f1818] lg:grid lg:grid-cols-[1.05fr_auto_1fr]">
  <div class="relative hidden min-h-screen overflow-hidden lg:block">
    <img
      src="/images/login/auth.jpg"
      alt="Mesa editorial con cuaderno y pluma"
      class="absolute inset-0 h-full w-full object-cover"
    >
    <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(46,9,11,0.52),rgba(46,9,11,0.82))]"></div>

    <div class="bookmark-card">
      <img src="/images/login/logo-form.png" width="111" height="149" alt="Pinta Ebook" class="h-auto w-24">
      <a href="/home" class="mt-2 inline-flex items-center gap-2 text-sm text-[#4e2e25] transition hover:text-[#7a4a3a]">
        <span aria-hidden="true">←</span>
        Volver a inicio
      </a>
    </div>

    <div class="relative z-10 mx-auto flex min-h-screen max-w-2xl items-center justify-center px-12 py-14 text-center text-white">
      <div>
        <p class="text-[0.82rem] font-semibold uppercase tracking-[0.31em] text-[#d5a658]">Bienvenido de nuevo</p>
        <h2 class="mt-8 text-balance font-[Georgia,Times_New_Roman,serif] text-6xl font-medium italic leading-[1.22] text-white">
          “ Donde las palabras
          encuentran su forma.
          ”
        </h2>
        <div class="mx-auto my-9 h-px w-14 bg-[#d5a658]"></div>
        <p class="mx-auto max-w-lg text-[1.95rem] font-[Georgia,Times_New_Roman,serif] leading-relaxed text-white/90">
          Inicia sesión y continúa el viaje editorial que comenzaste.
        </p>
      </div>
    </div>
  </div>

  <div class="hidden lg:block">
    <div class="login-ribbon" aria-hidden="true"></div>
  </div>

  <div class="relative flex min-h-screen items-center justify-center px-6 py-14 sm:px-10 lg:px-16">
    <form class="w-full max-w-xl" (ngSubmit)="onSubmit()">
      <p class="text-[0.82rem] font-semibold uppercase tracking-[0.23em] text-[#ba8b45]">Acceso</p>
      <h1 class="mt-5 font-[Georgia,Times_New_Roman,serif] text-[3.25rem] font-semibold leading-none text-[#3d1718]">Iniciar sesión</h1>
      <p class="mt-5 text-xl text-[#66544c]">Accede a tu biblioteca y proyectos.</p>

      <div class="mt-10 space-y-7">
        <div>
          <label for="email" class="mb-2.5 block text-[0.95rem] font-semibold uppercase tracking-[0.13em] text-[#7c675e]">Correo electrónico</label>
          <div class="relative">
            <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-[#9f9088]" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 7h16v10H4z"></path>
                <path d="m4 8 8 6 8-6"></path>
              </svg>
            </span>
            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="tu@correo.com"
              required
              class="h-15 w-full rounded-[1.1rem] border border-[#b69367] bg-white/95 pr-5 pl-12 text-lg text-[#2f1818] outline-none transition focus:border-[#8b5d24] focus:ring-4 focus:ring-[#d2a05730]"
            >
          </div>
        </div>

        <div>
          <label for="password" class="mb-2.5 block text-[0.95rem] font-semibold uppercase tracking-[0.13em] text-[#7c675e]">Contraseña</label>
          <div class="relative">
            <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-[#9f9088]" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
              </svg>
            </span>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
              class="h-15 w-full rounded-[1.1rem] border border-[#b69367] bg-white/95 pr-5 pl-12 text-lg text-[#2f1818] outline-none transition focus:border-[#8b5d24] focus:ring-4 focus:ring-[#d2a05730]"
            >
          </div>
        </div>
      </div>

      <div class="mt-6 flex flex-col gap-4 text-[1.1rem] text-[#6b5348] sm:flex-row sm:items-center sm:justify-between">
        <label class="inline-flex items-center gap-3">
          <input type="checkbox" class="h-4.5 w-4.5 rounded-sm border-[#8d7b72] text-[#5d131a] focus:ring-[#b88948]">
          <span>Recuérdame</span>
        </label>
        <a href="#" class="font-medium text-[#5d131a] transition hover:text-[#8c2832]">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="mt-8 h-15 w-full rounded-2xl bg-[#5d131a] text-[1.65rem] font-semibold text-white transition hover:bg-[#7e1f2a] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5d131a]">
        Entrar
      </button>

      <p class="mt-8 text-center text-[1.15rem] text-[#624f46]">
        ¿Aún no tienes cuenta?
        <a href="/home" class="font-semibold text-[#5d131a] underline-offset-3 transition hover:text-[#8c2832] hover:underline">Crear cuenta</a>
      </p>
    </form>
  </div>
</section>
