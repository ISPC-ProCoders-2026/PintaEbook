<div class="container py-4">
  <h1 class="h3 mb-3">Ebooks</h1>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th scope="col">Título</th>
          <th scope="col">Autor</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ebook of (ebooks$ | async) ?? []">
          <td>{{ ebook.title }}</td>
          <td>{{ ebook.author ?? '-' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
